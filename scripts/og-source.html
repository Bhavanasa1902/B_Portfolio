<!doctype html>
<html><head><meta charset="utf-8"><style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #F4F0E8;
    color: #1B1814;
    padding: 72px 88px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: 'Inter', system-ui, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #75695B;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #8B4F26; }
  .meta-right {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #75695B;
    line-height: 1.8;
  }
  .headline {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 116px;
    line-height: 0.95;
    letter-spacing: -0.035em;
    color: #1B1814;
    max-width: 980px;
  }
  .headline em {
    font-style: italic;
    font-weight: 400;
    color: #8B4F26;
  }
  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-top: 32px;
    border-top: 1px solid #DCD4C5;
  }
  .name {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 28px;
    font-weight: 500;
    color: #1B1814;
  }
  .name span {
    color: #75695B;
    font-weight: 400;
  }
  .stack {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 17px;
    color: #3A352E;
    letter-spacing: -0.01em;
  }
  .stack .sep { color: #C7BCA8; margin: 0 8px; }
  .corner-mark {
    position: absolute;
    top: 72px;
    right: 88px;
    width: 56px;
    height: 56px;
    border: 1.5px solid #8B4F26;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 22px;
    color: #8B4F26;
    font-weight: 500;
  }
</style></head>
<body>
  <div class="top">
    <div class="badge"><span class="dot"></span>Available · Full-Time Roles</div>
    <div class="meta-right">Fullerton, CA · 2026</div>
  </div>
  <div class="corner-mark">B</div>
  <h1 class="headline">Data that teams <em>trust</em>,<br/>systems that scale.</h1>
  <div class="bottom">
    <div class="name">Bhavana <span>Athavane</span> — Data Engineer</div>
    <div class="stack">SQL<span class="sep">/</span>Python<span class="sep">/</span>GCP<span class="sep">/</span>BigQuery<span class="sep">/</span>Vertex AI<span class="sep">/</span>ETL</div>
  </div>
</body></html>
