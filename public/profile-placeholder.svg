<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Profile photo placeholder">
  <defs>
    <!-- Subtle paper texture -->
    <pattern id="grain" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#F4F2EC"/>
      <circle cx="1" cy="1" r="0.4" fill="#D9D5CC" opacity="0.5"/>
      <circle cx="4" cy="3" r="0.3" fill="#C7C2B6" opacity="0.4"/>
    </pattern>
    <!-- Radial vignette -->
    <radialGradient id="vignette" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FBFAF6" stop-opacity="1"/>
      <stop offset="65%" stop-color="#F2EFE8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E5E1D6" stop-opacity="1"/>
    </radialGradient>
    <!-- Dashed ring marker -->
    <linearGradient id="ringFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A18" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1A1A18" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="480" fill="url(#vignette)"/>
  <rect width="480" height="480" fill="url(#grain)" opacity="0.6"/>

  <!-- Outer dashed placeholder ring — signals "swap me" -->
  <circle cx="240" cy="240" r="226" fill="none"
          stroke="url(#ringFade)" stroke-width="1"
          stroke-dasharray="3 7" stroke-linecap="round"/>

  <!-- Inner solid hairline ring -->
  <circle cx="240" cy="240" r="210" fill="none" stroke="#1A1A18" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Portrait silhouette — head + shoulders, monogram style -->
  <g fill="#1A1A18" fill-opacity="0.82">
    <!-- Shoulders -->
    <path d="M 110 410
             C 110 348, 168 312, 240 312
             C 312 312, 370 348, 370 410
             L 370 480 L 110 480 Z"/>
    <!-- Neck -->
    <path d="M 215 312 L 215 282 C 215 272, 265 272, 265 282 L 265 312 Z"/>
    <!-- Head -->
    <ellipse cx="240" cy="222" rx="68" ry="78"/>
  </g>

  <!-- Monogram — large serif "B" centered on silhouette -->
  <text x="240" y="246" text-anchor="middle"
        font-family="Cormorant Garamond, Georgia, serif"
        font-size="96" font-style="italic" font-weight="500"
        fill="#F4F2EC" letter-spacing="-2">B</text>

  <!-- Corner label — indicates placeholder -->
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace"
     font-size="9" letter-spacing="2" fill="#1A1A18" fill-opacity="0.5">
    <text x="30" y="38" text-transform="uppercase">PROFILE · PLACEHOLDER</text>
  </g>

  <!-- Tiny crosshair tick marks at four cardinal points -->
  <g stroke="#1A1A18" stroke-opacity="0.35" stroke-width="1">
    <line x1="240" y1="6" x2="240" y2="14"/>
    <line x1="240" y1="466" x2="240" y2="474"/>
    <line x1="6" y1="240" x2="14" y2="240"/>
    <line x1="466" y1="240" x2="474" y2="240"/>
  </g>
</svg>
